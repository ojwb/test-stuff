    - name: Set up Visual Studio shell
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x64
    - name: Restore vcpkg package cache
      uses: actions/cache/restore@v5
      with:
        key: ${{ github.job }}-${{ runner.os }}
        path: |
          /c/vcpkgbincache
    - name: Install packages
      shell: bash
      run: |
        export VCPKG_DEFAULT_BINARY_CACHE='c:\vcpkgbincache'
        mkdir -p /c/vcpkgbincache
        vcpkg install pkgconf
        vcpkg install libmagic
        vcpkg install pcre2
        vcpkg install zlib
        PATH=/c/vcpkg/packages/pkgconf_x64-windows/tools/pkgconf:$PATH
        export PKG_CONFIG_PATH=`printf '%s:' /c/vcpkg/packages/{zlib,libmagic,pcre2}_x64-windows/lib/pkgconfig`
        echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
        pkgconf zlib --cflags || true
        pkgconf zlib --libs || true
        cl `pkgconf zlib --cflags` -c zlibtest.cxx
        ls -l *.obj || true
        cl -nologo zlibtest.obj `pkgconf zlib --cflags` -Fezlibtest.exe
        ls -l *.exe || true
        zlibtest.exe
    - name: Save vcpkg package cache
      if: always()
      uses: actions/cache/save@v5
      with:
        key: ${{ github.job }}-${{ runner.os }}
        path: |
          /c/vcpkgbincache

