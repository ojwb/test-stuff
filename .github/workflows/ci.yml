name: CI

# Use bash by default on all platforms.
defaults:
  run:
    shell: bash

on:
  push:
    paths-ignore:
      - README.rst

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: 'ubuntu-latest'
          #- os: 'macos-latest'
          - os: 'macos-26-intel'
          - os: 'macos-15-intel'
          - os: 'macos-26'
          - os: 'macos-15'
          - os: 'macos-14'
          - vm: 'dragonflybsd'
          - vm: 'freebsd'
          - vm: 'netbsd'
          - vm: 'openbsd'
          - vm: 'solaris'
      fail-fast: false

    runs-on: ${{ matrix.os || 'ubuntu-latest' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Run in DragonflyBSD VM
      uses: vmactions/dragonflybsd-vm@v1
      if: matrix.vm == 'dragonflybsd'
      with:
        usesh: true
        copyback: false
        run: |
          cc -Wall -W -O2 testsigpipe.c -o testsigpipe
          ./testsigpipe

    - name: Run in FreeBSD VM
      uses: vmactions/freebsd-vm@v1
      if: matrix.vm == 'freebsd'
      with:
        usesh: true
        copyback: false
        run: |
          cc -Wall -W -O2 testsigpipe.c -o testsigpipe
          ./testsigpipe

    - name: Run in NetBSD VM
      uses: vmactions/netbsd-vm@v1
      if: matrix.vm == 'netbsd'
      with:
        usesh: true
        copyback: false
        run: |
          cc -Wall -W -O2 testsigpipe.c -o testsigpipe
          ./testsigpipe

    - name: Run in OpenBSD VM
      uses: vmactions/openbsd-vm@v1
      if: matrix.vm == 'openbsd'
      with:
        usesh: true
        copyback: false
        run: |
          cc -Wall -W -O2 testsigpipe.c -o testsigpipe
          ./testsigpipe

    - name: Run in Solaris VM
      uses: vmactions/solaris-vm@v1
      if: matrix.vm == 'solaris'
      with:
        usesh: true
        copyback: false
        prepare: |
          pkgutil -y -i gcc5core
        run: |
          gcc -Wall -W -O2 testsigpipe.c -o testsigpipe
          ./testsigpipe

    - name: Build
      if: matrix.vm == ''
      run: |
        gcc -Wall -W -O2 testsigpipe.c -o testsigpipe

    - name: Run
      if: matrix.vm == ''
      run: |
        ./testsigpipe

